version: edu_gate_v3.0
status: frozen_for_v3_run
construct:
  name: education-sector relevance
  unit: paragraph-based chunk
  note: Vocabulary derived from ERIC Thesaurus, UNESCO Thesaurus, and ISCED. Recommended gate roles reflect application to
    a heterogeneous AI-governance corpus, not the controlled vocabularies' own indexing rules.
selection_principles:
- Standalone anchors explicitly denote educational systems, levels, institutions, actors, pedagogical constructs, education
  governance, or education-specific technologies.
- Context-dependent terms are valid education concepts but have common noneducation senses in AI-governance text and should
  not independently establish education relevance.
- Workforce/capacity terms are descriptive tags only so their prevalence can be measured rather than built into corpus selection.
- Higher-education research-only terms are treated cautiously because a university or professor can be mentioned in a research
  role without the chunk governing education.
